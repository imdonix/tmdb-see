{{- if .Values.ncore.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncore
  labels:
    app.kubernetes.io/name: ncore
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ncore
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ncore
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: ncore
          image: {{ .Values.ncore.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ncore
  labels:
    app.kubernetes.io/name: ncore
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ncore
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
