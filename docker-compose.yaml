name: tmdb-see

services:
  ncore:
    image: imdonix/ncore:latest
    container_name: ncore-api
    ports:
      - "1001:8080"
    restart: unless-stopped

  qbit:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbit
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      WEBUI_PORT: 1002
    ports:
      - "1002:1002"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./tmp/qbit_config:/config
      - ./tmp/qbit_downloads:/downloads
    restart: unless-stopped

  see:
    build: .
    container_name: tmdb-see
    depends_on:
      - ncore
      - qbit
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      NCORE_HOST: http://ncore:8080
      QBIT_HOST: http://qbit:1002
      QBIT_SAVE_PATH: /downloads
      QBIT_ORGANIZE: "true"
    ports:
      - "8080:8080"
    volumes:
      - see-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  see-data:
