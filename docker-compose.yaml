name: tmdb-see

services:
  ncore:
    image: imdonix/ncore:latest
    container_name: ncore-api
    ports:
      - "1001:8080"
    restart: unless-stopped

  qbit:
    image: qbittorrentofficial/qbittorrent-nox:latest
    container_name: qbit
    # The official image has no credential support, so seed QBIT_USER/QBIT_PASS
    # into the WebUI config and then hand over to the real entrypoint.
    entrypoint: ["python3", "/seed/qbit-seed-config.py"]
    env_file:
      - .env
    environment:
      QBT_LEGAL_NOTICE: confirm
      QBT_WEBUI_PORT: 1002
      QBT_TORRENTING_PORT: 6881
      QBT_EXEC_ENTRYPOINT: "1"
      QBIT_CONFIG: /config/qBittorrent/config/qBittorrent.conf
      PUID: 1000
      PGID: 1000
    ports:
      - "1002:1002"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./tmp/qbit_config:/config
      - ./tmp/qbit_downloads:/downloads
      - ./k8s/tmdb-see/files/qbit-seed-config.py:/seed/qbit-seed-config.py:ro
    restart: unless-stopped

  see:
    build: .
    container_name: tmdb-see
    depends_on:
      - ncore
      - qbit
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      NCORE_HOST: http://ncore:8080
      QBIT_HOST: http://qbit:1002
      QBIT_SAVE_PATH: /downloads
      QBIT_ORGANIZE: "true"
    ports:
      - "8080:8080"
    volumes:
      - see-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  see-data:
